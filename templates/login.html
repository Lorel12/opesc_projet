<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#18334e">
        <title>Connexion | Prévisions économiques</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.1/css/all.css">
    </head>
    <body>
        <div class="login">
            <div class="auth-eyebrow"><i class="fas fa-chart-line" aria-hidden="true"></i> Prévisions économiques</div>
            <h1>Bienvenue</h1>
            <p class="auth-intro">Connectez-vous pour accéder à vos outils d’analyse et aux actualités économiques.</p>
            <div class="links">
                <a href="{{ url_for('login') }}" class="active" aria-current="page">Connexion</a>
                <a href="{{ url_for('register') }}">Créer un compte</a>
            </div>
            <form action="{{ url_for('login') }}" method="post" autocomplete="on">
                <div class="field">
                    <label for="username">
                        <i class="fas fa-user" aria-hidden="true"></i>
                        <span class="sr-only">Nom d’utilisateur</span>
                    </label>
                    <input type="text" name="username" placeholder="Nom d’utilisateur" id="username" required autocomplete="username">
                </div>

                <div class="field field-password">
                    <label for="password">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <span class="sr-only">Mot de passe</span>
                    </label>
                    <input type="password" name="password" placeholder="Mot de passe" id="password" required autocomplete="current-password">
                    <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Afficher le mot de passe" aria-pressed="false">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>

                {% if msg %}
                <div class="msg" role="alert">{{ msg }}</div>
                {% endif %}
                <input type="submit" value="Se connecter">
            </form>
        </div>
        <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    </body>
</html>
